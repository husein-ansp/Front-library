<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | کتابخانه علامه حلی ۳</title>

    <!-- bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <!-- bootstrap icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- register CSS -->

    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <!-- background -->

    <div class="background-animation">
        <span class="bubble bubble-1"></span>
        <span class="bubble bubble-2"></span>
        <span class="bubble bubble-3"></span>
        <span class="bubble bubble-4"></span>
        <span class="bubble bubble-5"></span>
    </div>

    <!-- main -->

    <main class="register-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                    <!-- card -->

                    <div class="register-card">

                        <!-- logo -->

                        <div class="logo-wrapper">
                            <div class="logo">
                                <i class="bi bi-person-plus-fill"></i>
                            </div>
                        </div>

                        <!-- title -->

                        <div class="text-center title-area">
                            <h1 class="register-title">
                                ساخت حساب کاربری
                            </h1>
                            <p class="register-subtitle">
                                به کتابخانه علامه حلی ۳ خوش آمدید
                            </p>
                        </div>

                        <!-- form -->

                        <form id="registerForm">

                            <!-- full name -->

                            <div class="form-group">
                                <label for="fullname">
                                    نام و نام خانوادگی
                                </label>
                                <div class="input-wrapper">
                                    <i class="bi bi-person input-icon"></i>
                                    <input
                                        type="text"
                                        id="fullname"
                                        class="form-control custom-input"
                                        placeholder="نام و نام خانوادگی"
                                        autocomplete="name"
                                        required
                                    >
                                </div>
                            </div>

                            <!-- username -->

                            <div class="form-group">
                                <label for="username">
                                    نام کاربری
                                </label>
                                <div class="input-wrapper">
                                    <i class="bi bi-at input-icon"></i>
                                    <input
                                        type="text"
                                        id="username"
                                        class="form-control custom-input"
                                        placeholder="نام کاربری خود را انتخاب کنید"
                                        autocomplete="username"
                                        required
                                    >
                                </div>
                            </div>

                            <!-- password -->

                            <div class="form-group">
                                <label for="password">
                                    رمز عبور
                                </label>
                                <div class="input-wrapper">
                                    <i class="bi bi-lock input-icon"></i>
                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control custom-input password-input"
                                        placeholder="رمز عبور خود را وارد کنید"
                                        maxlength="16"
                                        autocomplete="new-password"
                                        required
                                    >
                                    <button
                                        type="button"
                                        class="password-toggle"
                                        id="togglePassword"
                                        aria-label="نمایش رمز عبور"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                                <!-- password strength -->

                                <div
                                    id="passwordStrength"
                                    class="password-strength"
                                >
                                    <div class="strength-track">
                                        <div
                                            id="strengthBar"
                                            class="strength-bar"
                                        ></div>
                                    </div>
                                    <div class="strength-info">
                                        <span id="strengthText">
                                            قدرت رمز عبور
                                        </span>
                                        <span id="passwordCounter">
                                            0 / 16
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <!-- confirm password -->

                            <div class="form-group">
                                <label for="confirmPassword">
                                    تکرار رمز عبور
                                </label>
                                <div class="input-wrapper">
                                    <i class="bi bi-shield-lock input-icon"></i>
                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        class="form-control custom-input password-input"
                                        placeholder="رمز عبور را دوباره وارد کنید"
                                        maxlength="16"
                                        autocomplete="new-password"
                                        required
                                    >
                                    <button
                                        type="button"
                                        class="password-toggle"
                                        id="toggleConfirmPassword"
                                        aria-label="نمایش رمز عبور"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div
                                    id="passwordMatch"
                                    class="password-match"
                                ></div>
                            </div>

                            <!-- terms -->

                            <div class="terms-row">
                                <input
                                    type="checkbox"
                                    id="terms"
                                    required
                                >
                                <label for="terms">
                                    قوانین و شرایط کتابخانه را می‌پذیرم.
                                </label>
                            </div>

                            <!-- button -->

                            <button
                                type="submit"
                                class="register-button"
                            >
                                <span>
                                    ساخت حساب کاربری
                                </span>
                                <i class="bi bi-arrow-left"></i>
                            </button>
                        </form>

                        <!-- ogin -->

                        <div class="login-section">
                            <span>
                                قبلاً حساب کاربری دارید؟
                            </span>
                            <a href="login.html">
                                وارد شوید
                            </a>
                        </div>

                        <!-- Home -->

                        <div class="back-home">
                            <a href="index.html">
                                <i class="bi bi-arrow-right"></i>
                                بازگشت به صفحه اصلی
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript -->

    <script src="js/register.js"></script>
</body>
</html>
