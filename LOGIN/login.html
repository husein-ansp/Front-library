<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>ورود به کتابخانه</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="background-animation">
        <span class="bubble bubble-1"></span>
        <span class="bubble bubble-2"></span>
        <span class="bubble bubble-3"></span>
        <span class="bubble bubble-4"></span>
        <span class="bubble bubble-5"></span>
    </div>

    <!-- Main Container -->

    <main class="login-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                    <!-- Login Card -->

                    <div class="login-card">

                        <!-- Logo -->

                        <div class="logo-wrapper">
                            <div class="logo">
                                <i class="bi bi-book-half"></i>
                            </div>
                        </div>

                        <!-- Title -->

                        <div class="text-center mb-4">
                            <h1 class="login-title">
                                ورود به حساب کاربری
                            </h1>
                            <p class="login-subtitle">
                                به کتابخانه علامه حلی ۳ خوش آمدید
                            </p>
                        </div>

                        <!-- Form -->

                        <form id="loginForm">

                            <!-- Username -->

                            <div class="form-group">
                                <label for="username">
                                    نام کاربری
                                </label>
                                <div class="input-wrapper">
                                    <i class="bi bi-person input-icon"></i>
                                    <input
                                        type="text"
                                        id="username"
                                        name="username"
                                        class="form-control custom-input"
                                        placeholder="نام کاربری خود را وارد کنید"
                                        autocomplete="username"
                                        required
                                    >
                                </div>
                            </div>

                            <!-- Password -->

                            <div class="form-group">
                                <label for="password">
                                    رمز عبور
                                </label>
                                <div class="input-wrapper">
                                    <i class="bi bi-lock input-icon"></i>
                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        class="form-control custom-input password-input"
                                        placeholder="رمز عبور خود را وارد کنید"
                                        maxlength="16"
                                        autocomplete="current-password"
                                        required
                                    >
                                    <button
                                        type="button"
                                        id="togglePassword"
                                        class="password-toggle"
                                        aria-label="نمایش رمز عبور"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                                <!-- Password Strength -->

                                <div
                                    id="passwordStrength"
                                    class="password-strength"
                                >
                                    <div class="strength-track">
                                        <div
                                            id="strengthBar"
                                            class="strength-bar"
                                        ></div>
                                    </div>
                                    <div class="strength-info">
                                        <span id="strengthText">
                                            قدرت رمز عبور
                                        </span>
                                        <span id="passwordCounter">
                                            0 / 16
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <!-- Remember + Forgot -->

                            <div class="options-row">
                                <div class="remember-box">
                                    <input
                                        type="checkbox"
                                        id="remember"
                                        class="custom-checkbox"
                                    >
                                    <label for="remember">
                                        مرا به خاطر بسپار
                                    </label>
                                </div>
                                <a
                                    href="#"
                                    class="forgot-password"
                                >
                                    فراموشی رمز عبور؟
                                </a>

                            </div>

                            <!-- Login Button -->

                            <button
                                type="submit"
                                class="login-button"
                            >
                                <span>
                                    ورود به کتابخانه
                                </span>
                                <i class="bi bi-arrow-left"></i>
                            </button>
                        </form>

                        <!-- Register -->

                        <div class="register-section">
                            <span>
                                حساب کاربری ندارید؟
                            </span>
                            <a href="register.html">
                                ثبت‌نام کنید
                            </a>
                        </div>

                        <!-- Back Home -->

                        <div class="back-home">
                            <a href="index.html">
                                <i class="bi bi-arrow-right"></i>
                                بازگشت به صفحه اصلی
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript -->

    <script src="js/login.js"></script>
</body>
</html>
